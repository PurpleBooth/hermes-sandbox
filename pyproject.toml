[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-sandbox"
version = "0.1.0"
description = "Ephemeral cloud-VM terminal sandbox plugin for Hermes Agent."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Billie Thompson", email = "billie@example.com"}]
keywords = ["hermes", "hermes-agent", "plugin", "sandbox", "cloud", "vm", "hetzner", "digitalocean", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = ["pyyaml>=6"]  # stdlib + PyYAML — urllib for cloud REST, yaml for cloud-init

[project.urls]
Homepage = "https://codeberg.org/PurpleBooth/hermes-sandbox"
Repository = "https://codeberg.org/PurpleBooth/hermes-sandbox"
Issues = "https://codeberg.org/PurpleBooth/hermes-sandbox/issues"
Changelog = "https://codeberg.org/PurpleBooth/hermes-sandbox/src/branch/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "twine>=5", "hypothesis>=6", "mutmut>=3"]

# PEP 735 dependency groups — uv syncs these by default (no --extra needed).
[dependency-groups]
dev = ["pytest>=7", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "twine>=5", "hypothesis>=6", "mutmut>=3"]

[tool.setuptools]
packages = ["hermes_sandbox"]

# Include the plugin.yaml manifest so Hermes' PluginManager can discover the
# plugin when installed via pip (not just from a symlinked source checkout).
[tool.setuptools.package-data]
hermes_sandbox = ["plugin.yaml", "AGENTS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",              # show short summary of all except passed
    "--strict-markers", # typo'd @pytest.mark.foo -> error, not silent skip
    "--cov=hermes_sandbox", # measure coverage of the plugin package
    "--cov-report=term-missing",
    "--cov-branch",     # branch coverage, not just line
]
filterwarnings = [
    "error",            # warnings are failures — catch regressions early
]

# ── ruff ────────────────────────────────────────────────────────────────────
# Match Hermes-agent's relaxed style: line-length 100, target py3.11.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".git", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
# Start conservative — real bugs + style that catches mistakes.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused vars, imports, etc.)
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear (likely-buggy patterns)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line-too-long handled by formatter; we don't enforce hard wrap
    "B008",  # function-call-in-default-argument (used for dataclass defaults)
    "SIM108", # ternary-vs-if — explicit if/else is clearer for our case
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "E402",  # module-level imports after sys.path manipulation in conftest
    "F401",  # unused imports in test fixtures are common
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── coverage ────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["hermes_sandbox"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ── mypy ────────────────────────────────────────────────────────────────────
# Strict on the plugin source; lenient on tests (they exercise runtime shapes
# mypy can't always see, e.g. injecting fake HTTP functions).
[tool.mypy]
python_version = "3.11"
packages = ["hermes_sandbox"]
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
# Hermes itself isn't typed/installed as a dependency — we only import it
# lazily inside functions, so treat it as untyped/ignore.
ignore_missing_imports = true
exclude = ["tests/"]

# ── mutmut (mutation testing) ───────────────────────────────────────────────
# Mutate only the pure-logic modules where mutants are cheap and meaningful.
# The provider concrete classes (hetzner/digitalocean/qemu) make subprocess /
# network calls and are exercised via injected fakes, so they are excluded to
# keep mutation runs fast and deterministic.
[tool.mutmut]
source_paths = [
    "hermes_sandbox/models.py",
    "hermes_sandbox/config.py",
    "hermes_sandbox/state.py",
    "hermes_sandbox/provider.py",
]
# Disable coverage collection during mutation runs — speed over metrics.
runner = "uv run pytest -x -q --no-header --no-cov tests"
